# --- reed-provider connector configuration (the OEM that owns the REED assets) ---
edc.participant.id=reed-provider
edc.runtime.id=reed-provider

# API endpoints (container-internal ports)
web.http.port=19191
web.http.path=/api
web.http.management.port=19193
web.http.management.path=/management
web.http.control.port=19192
web.http.control.path=/control
web.http.protocol.port=19194
web.http.protocol.path=/protocol
web.http.version.port=19195
web.http.version.path=/version

# DSP protocol URL the reed-provider advertises to other dataspace participants
edc.dsp.callback.address=http://reed-provider:19194/protocol

# Data-plane public API (where the consumer pulls data from when using EDR)
edc.dataplane.api.public.baseurl=http://localhost:19291/public/
web.http.public.port=19291
web.http.public.path=/public

# Data-plane self-registration into its own control plane
edc.transfer.proxy.token.signer.privatekey.alias=reed-provider-signing-key
edc.transfer.proxy.token.verifier.publickey.alias=reed-provider-verification-key

# HashiCorp Vault
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root
edc.vault.hashicorp.health.check.enabled=false

# CORS – required for the browser-based Data Dashboard
edc.web.rest.cors.enabled=true
edc.web.rest.cors.origins=*
edc.web.rest.cors.headers=origin, content-type, accept, authorization, x-api-key
edc.web.rest.cors.methods=GET, POST, DELETE, PUT, OPTIONS
