    environment:
      EDC_VAULT_HASHICORP_TOKEN: ${VAULT_TOKEN_FEDERATED_CATALOG}
      EDC_WEB_HTTPS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD}
      EDC_WEB_HTTPS_KEYMANAGER_PASSWORD: ${TLS_KEYSTORE_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=reed-trust
    mem_limit: 1g
    volumes:
      - ./federated-catalog/config.properties:/app/config/config.properties:ro
      - ./federated-catalog/participants.json:/app/config/participants.json:ro
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
      - ./tls/federated-catalog.crt:/tls/federated-catalog.crt:ro
      - ./tls/federated-catalog.key:/tls/federated-catalog.key:ro
      - ./tls/federated-catalog.p12:/tls/federated-catalog.p12:ro
    ports: ["127.0.0.1:39193:39193"]

  # ---------- REED Dashboard (React SPA; login via Keycloak) ----------
  dashboard:
    image: reed/dashboard:local
    build:
      context: ../services/reed-dashboard
    container_name: reed-dashboard
    ports: ["127.0.0.1:8088:8080"]
    volumes:
      - ./dashboard/config.json:/usr/share/nginx/html/config.json:ro
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
      - ./tls/dashboard.crt:/tls/dashboard.crt:ro
      - ./tls/dashboard.key:/tls/dashboard.key:ro
      - ./tls/dashboard.p12:/tls/dashboard.p12:ro

volumes:
  reed-pgdata:
  reed-vault-data:
  reed-vault-init:
