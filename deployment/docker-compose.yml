# GENERATED by tools/gen_topology.py from deployment/roster.json - do not edit by hand.
# Secrets are interpolated from deployment/.env (generated, gitignored).
name: reed

services:
  # ---------- HashiCorp Vault (file storage: secrets survive restarts) ----------
  vault:
    image: hashicorp/vault:1.17
    container_name: reed-vault
    cap_add: [IPC_LOCK]
    command: ["server"]   # the image entrypoint adds -config=/vault/config
    volumes:
      - ./vault-init/vault.hcl:/vault/config/vault.hcl:ro
      - reed-vault-data:/vault/file
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
      - ./tls/vault.crt:/tls/vault.crt:ro
      - ./tls/vault.key:/tls/vault.key:ro
      - ./tls/vault.p12:/tls/vault.p12:ro
    ports: ["127.0.0.1:8200:8200"]
    healthcheck:
      # healthy as soon as it answers, sealed or not (exit 2) - vault-init unseals it
      test: ["CMD-SHELL", "VAULT_ADDR=https://127.0.0.1:8200 VAULT_CACERT=/tls/ca.crt vault status > /dev/null; [ $$? -ne 1 ]"]
      interval: 2s
      retries: 30

  # Initialises/unseals Vault and provisions one folder, policy and token per identity.
  vault-init:
    image: hashicorp/vault:1.17
    container_name: reed-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_TOKEN_NORDVIND: ${VAULT_TOKEN_NORDVIND}
      VAULT_TOKEN_HANSE: ${VAULT_TOKEN_HANSE}
      VAULT_TOKEN_CASTELLUM: ${VAULT_TOKEN_CASTELLUM}
      VAULT_TOKEN_WISLA: ${VAULT_TOKEN_WISLA}
      VAULT_TOKEN_MAASVLAKTE: ${VAULT_TOKEN_MAASVLAKTE}
      VAULT_TOKEN_RHEIN_NDT: ${VAULT_TOKEN_RHEIN_NDT}
      VAULT_TOKEN_KOMATSU: ${VAULT_TOKEN_KOMATSU}
      VAULT_TOKEN_FEDERATED_CATALOG: ${VAULT_TOKEN_FEDERATED_CATALOG}
      VAULT_TOKEN_ISSUER: ${VAULT_TOKEN_ISSUER}
      MGMT_KEY_NORDVIND: ${MGMT_KEY_NORDVIND}
      CALLBACK_KEY_NORDVIND: ${CALLBACK_KEY_NORDVIND}
      MGMT_KEY_HANSE: ${MGMT_KEY_HANSE}
      CALLBACK_KEY_HANSE: ${CALLBACK_KEY_HANSE}
      MGMT_KEY_CASTELLUM: ${MGMT_KEY_CASTELLUM}
      CALLBACK_KEY_CASTELLUM: ${CALLBACK_KEY_CASTELLUM}
      MGMT_KEY_WISLA: ${MGMT_KEY_WISLA}
      CALLBACK_KEY_WISLA: ${CALLBACK_KEY_WISLA}
      MGMT_KEY_MAASVLAKTE: ${MGMT_KEY_MAASVLAKTE}
      CALLBACK_KEY_MAASVLAKTE: ${CALLBACK_KEY_MAASVLAKTE}
      MGMT_KEY_RHEIN_NDT: ${MGMT_KEY_RHEIN_NDT}
      CALLBACK_KEY_RHEIN_NDT: ${CALLBACK_KEY_RHEIN_NDT}
      MGMT_KEY_KOMATSU: ${MGMT_KEY_KOMATSU}
      CALLBACK_KEY_KOMATSU: ${CALLBACK_KEY_KOMATSU}
      MGMT_KEY_FEDERATED_CATALOG: ${MGMT_KEY_FEDERATED_CATALOG}
    volumes:
      - ./vault-init/init.sh:/init.sh:ro
      - ./vault/keys:/keys:ro
      - reed-vault-init:/vault/init
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  # ---------- Postgres: REED registry, Keycloak, Issuer, every IdentityHub and connector ----------
  postgres:
    image: postgres:16-alpine
    container_name: reed-postgres
    # the server key must belong to the postgres user with mode 600: copy it out of the read-only mount
    entrypoint: ["sh", "-c", "install -o postgres -g postgres -m 600 /tls/postgres.key /var/lib/postgresql/server.key && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/postgres.crt",
              "-c", "ssl_key_file=/var/lib/postgresql/server.key", "-c", "hba_file=/etc/reed/pg_hba.conf"]
    environment:
      POSTGRES_DB: reed
      POSTGRES_USER: reed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - reed-pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/pg_hba.conf:/etc/reed/pg_hba.conf:ro
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
      - ./tls/postgres.crt:/tls/postgres.crt:ro
      - ./tls/postgres.key:/tls/postgres.key:ro
      - ./tls/postgres.p12:/tls/postgres.p12:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reed -d reed"]
      interval: 2s
      retries: 30

  # ---------- Keycloak (production mode, Postgres): human login, organisations, roles ----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: reed-keycloak
    command: ["start", "--import-realm", "--health-enabled=true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/tls/ca.crt
      KC_DB_USERNAME: reed
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTPS_CERTIFICATE_FILE: /tls/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /tls/keycloak.key
      KC_HTTP_ENABLED: "false"
      KC_HTTP_MANAGEMENT_SCHEME: http   # health endpoint (port 9000) stays container-internal
    volumes:
      - ./keycloak/reed-realm.json:/opt/keycloak/data/import/reed-realm.json:ro
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
      - ./tls/keycloak.crt:/tls/keycloak.crt:ro
      - ./tls/keycloak.key:/tls/keycloak.key:ro
      - ./tls/keycloak.p12:/tls/keycloak.p12:ro
    ports: ["127.0.0.1:8180:8443"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 90

  # ---------- Local LLM gateway: LiteLLM -> Ollama (host) / vLLM, model Qwen3.8 ----------
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.89.2
    container_name: reed-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000",
              "--ssl_keyfile_path", "/tls/litellm.key", "--ssl_certfile_path", "/tls/litellm.crt"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      SSL_CERT_FILE: /tls/ca.crt   # trust the REED CA towards vLLM
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
      - ./tls/litellm.crt:/tls/litellm.crt:ro
      - ./tls/litellm.key:/tls/litellm.key:ro
      - ./tls/litellm.p12:/tls/litellm.p12:ro
    ports: ["127.0.0.1:4000:4000"]

  # Optional GPU backend (docker compose --profile vllm up): Qwen3.8 NVFP4 from the local HF cache.
  vllm:
    image: vllm/vllm-openai:nightly
    container_name: reed-vllm
    profiles: ["vllm"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
      - ./tls/vllm.crt:/tls/vllm.crt:ro
      - ./tls/vllm.key:/tls/vllm.key:ro
      - ./tls/vllm.p12:/tls/vllm.p12:ro
    command: ["--model", "nvidia/Qwen3.8-27B-NVFP4", "--served-model-name", "qwen3.8",
              "--ssl-keyfile", "/tls/vllm.key", "--ssl-certfile", "/tls/vllm.crt",
              "--max-model-len", "32768", "--gpu-memory-utilization", "0.45",
              "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3"]
    ports: ["127.0.0.1:8000:8000"]

  # ---------- REED backend ----------
  reed-backend:
    image: reed/backend:local
    build:
      context: ../services/reed-backend
    container_name: reed-backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      REED_DB_URL: jdbc:postgresql://postgres:5432/reed?sslmode=verify-full&sslrootcert=/tls/ca.crt
      SERVER_SSL_CERTIFICATE: file:/tls/reed-backend.crt
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: file:/tls/reed-backend.key
      REED_DB_USER: reed
      REED_DB_PASSWORD: ${POSTGRES_PASSWORD}
      REED_MGMT_KEYS: ${REED_MGMT_KEYS}
      REED_CALLBACK_KEYS: ${REED_CALLBACK_KEYS}
      REED_DATA_KEYS: ${REED_DATA_KEYS}
      REED_DID_PATTERN: "did:web:{name}-ih%3A7083:{name}"
      REED_LLM_API_KEY: ${LITELLM_MASTER_KEY}
      REED_LLM_MODEL: ${REED_LLM_MODEL:-reed-llm}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=reed-trust
    volumes:
      - ./roster.json:/app/deployment/roster.json:ro
      - ./scenarios:/app/deployment/scenarios:ro
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
      - ./tls/reed-backend.crt:/tls/reed-backend.crt:ro
      - ./tls/reed-backend.key:/tls/reed-backend.key:ro
      - ./tls/reed-backend.p12:/tls/reed-backend.p12:ro
    ports: ["127.0.0.1:8081:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/tls/ca.crt", "https://127.0.0.1:8080/reed/health"]
      interval: 5s
      retries: 60

  # ---------- REED Issuer Service (the dataspace's credential authority) ----------
  issuerservice:
    image: reed/issuerservice:local
    build:
      context: ../launchers/issuerservice
    container_name: reed-issuerservice
    depends_on:
      vault-init:
        condition: service_completed_successfully
      reed-backend:
        condition: service_healthy
    environment:
      EDC_VAULT_HASHICORP_TOKEN: ${VAULT_TOKEN_ISSUER}
      EDC_DATASOURCE_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      EDC_IH_API_SUPERUSER_KEY: ${ISSUER_KEY}
      EDC_DATASOURCE_REED_PASSWORD: ${POSTGRES_PASSWORD}
      EDC_WEB_HTTPS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD}
      EDC_WEB_HTTPS_KEYMANAGER_PASSWORD: ${TLS_KEYSTORE_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=reed-trust
    mem_limit: 1g
    volumes:
      - ./issuerservice/config.properties:/app/config/config.properties:ro
      - ./tls/ca.crt:/tls/ca.crt:ro
      - ./tls/truststore.p12:/tls/truststore.p12:ro
      - ./tls/issuerservice.crt:/tls/issuerservice.crt:ro
      - ./tls/issuerservice.key:/tls/issuerservice.key:ro
      - ./tls/issuerservice.p12:/tls/issuerservice.p12:ro
    ports: ["127.0.0.1:10013:10013", "127.0.0.1:10015:10015"]   # issuer admin + identity APIs (x-api-key)
    healthcheck:
      test: ["CMD", "curl", "-fs", "--cacert", "/tls/ca.crt", "https://127.0.0.1:10010/api/check/readiness"]
      interval: 5s
      retries: 60

  # IdentityHub of Nordvind Energy Systems AS
  nordvind-ih:
    image: reed/identityhub:local
    build:
      context: ../launchers/identity-hub
    container_name: reed-nordvind-ih
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # its credential watchdog checks revocation status lists at the issuer on start; if the issuer
      # is not up yet the credentials are moved to ERROR and never recover
      issuerservice:
        condition: service_healthy
    environment:
      EDC_VAULT_HASHICORP_TOKEN: ${VAULT_TOKEN_NORDVIND}
      EDC_DATASOURCE_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      EDC_IH_API_SUPERUSER_KEY: ${IH_KEY_NORDVIND}
      EDC_WEB_HTTPS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD}
      EDC_WEB_HTTPS_KEYMANAGER_PASSWORD: ${TLS_KEYSTORE_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=reed-trust
    mem_limit: 1g
    volumes:
      - ./identityhub/nordvind.properties:/app/config/config.properties:ro
