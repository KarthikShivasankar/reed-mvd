# GENERATED by tools/gen_topology.py from deployment/roster.json - do not edit by hand.
# Identity mode: dcp. Secrets are interpolated from deployment/.env (generated, gitignored).
name: reed

services:
  # ---------- HashiCorp Vault (dev mode: in-memory, restart = reseed) ----------
  vault:
    image: hashicorp/vault:1.17
    container_name: reed-vault
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 2s
      retries: 30

  # Seeds EDR signing keys and Management API keys into Vault.
  init-vault:
    image: hashicorp/vault:1.17
    container_name: reed-init-vault
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      MGMT_KEY_FEDERATED_CATALOG: ${MGMT_KEY_FEDERATED_CATALOG}
      MGMT_KEY_NORDVIND: ${MGMT_KEY_NORDVIND}
      MGMT_KEY_HANSE: ${MGMT_KEY_HANSE}
      MGMT_KEY_CASTELLUM: ${MGMT_KEY_CASTELLUM}
      MGMT_KEY_WISLA: ${MGMT_KEY_WISLA}
      MGMT_KEY_MAASVLAKTE: ${MGMT_KEY_MAASVLAKTE}
      MGMT_KEY_RHEIN_NDT: ${MGMT_KEY_RHEIN_NDT}
    volumes:
      - ./vault/keys:/keys:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        vault kv put secret/nordvind-signing-key content=@/keys/nordvind-signing-key.pem
        vault kv put secret/nordvind-verification-key content=@/keys/nordvind-verification-key.pem
        vault kv put secret/nordvind-mgmt-api-key content="$MGMT_KEY_NORDVIND"
        vault kv put secret/hanse-signing-key content=@/keys/hanse-signing-key.pem
        vault kv put secret/hanse-verification-key content=@/keys/hanse-verification-key.pem
        vault kv put secret/hanse-mgmt-api-key content="$MGMT_KEY_HANSE"
        vault kv put secret/castellum-signing-key content=@/keys/castellum-signing-key.pem
        vault kv put secret/castellum-verification-key content=@/keys/castellum-verification-key.pem
        vault kv put secret/castellum-mgmt-api-key content="$MGMT_KEY_CASTELLUM"
        vault kv put secret/wisla-signing-key content=@/keys/wisla-signing-key.pem
        vault kv put secret/wisla-verification-key content=@/keys/wisla-verification-key.pem
        vault kv put secret/wisla-mgmt-api-key content="$MGMT_KEY_WISLA"
        vault kv put secret/maasvlakte-signing-key content=@/keys/maasvlakte-signing-key.pem
        vault kv put secret/maasvlakte-verification-key content=@/keys/maasvlakte-verification-key.pem
        vault kv put secret/maasvlakte-mgmt-api-key content="$MGMT_KEY_MAASVLAKTE"
        vault kv put secret/rhein-ndt-signing-key content=@/keys/rhein-ndt-signing-key.pem
        vault kv put secret/rhein-ndt-verification-key content=@/keys/rhein-ndt-verification-key.pem
        vault kv put secret/rhein-ndt-mgmt-api-key content="$MGMT_KEY_RHEIN_NDT"
        vault kv put secret/federated-catalog-mgmt-api-key content="$MGMT_KEY_FEDERATED_CATALOG"
        vault kv put secret/aes-key-alias content="$(head -c 32 /dev/urandom | base64)"
        echo "Vault seeded."

  # ---------- Postgres (REED backend; identity services in dcp mode) ----------
  postgres:
    image: postgres:16-alpine
    container_name: reed-postgres
    environment:
      POSTGRES_DB: reed
      POSTGRES_USER: reed
      POSTGRES_PASSWORD: reed
    volumes:
      - reed-pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reed -d reed"]
      interval: 2s
      retries: 30

  # ---------- Keycloak: human login (OIDC), organisations and roles ----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: reed-keycloak
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/reed-realm.json:/opt/keycloak/data/import/reed-realm.json:ro
    ports: ["8180:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  # ---------- Local LLM gateway: LiteLLM -> Ollama (host) / vLLM, model Qwen3.8 ----------
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.89.2
    container_name: reed-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports: ["4000:4000"]

  # Optional GPU backend (docker compose --profile vllm up): Qwen3.8 NVFP4 from the local HF cache.
  vllm:
    image: vllm/vllm-openai:nightly
    container_name: reed-vllm
    profiles: ["vllm"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    command: ["--model", "nvidia/Qwen3.8-27B-NVFP4", "--served-model-name", "qwen3.8",
              "--max-model-len", "32768", "--gpu-memory-utilization", "0.45",
              "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3"]
    ports: ["8000:8000"]

  # ---------- REED backend ----------
  reed-backend:
    image: reed/backend:local
    build:
      context: ../services/reed-backend
    container_name: reed-backend
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      REED_DB_URL: jdbc:postgresql://postgres:5432/reed
      REED_DB_USER: reed
      REED_DB_PASSWORD: reed
      REED_API_KEY: ${REED_SUBMODEL_KEY}
      REED_MGMT_KEYS: ${REED_MGMT_KEYS}
      REED_IDENTITY_MODE: dcp
      REED_LLM_API_KEY: ${LITELLM_MASTER_KEY}
      REED_LLM_MODEL: ${REED_LLM_MODEL:-reed-llm}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    volumes:
      - ./roster.json:/app/deployment/roster.json:ro
      - ./scenarios:/app/deployment/scenarios:ro
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/reed/health"]
      interval: 5s
      retries: 60

  # ---------- Identity: shared IdentityHub (DIDs, VCs, STS) + REED Issuer Service ----------
  identityhub:
    image: reed/identityhub:local
    build:
      context: ../launchers/identity-hub
    container_name: reed-identityhub
    depends_on:
      init-vault:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      EDC_IH_API_SUPERUSER_KEY: ${IH_SUPERUSER_KEY}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    volumes:
      - ./identityhub/config.properties:/app/config/config.properties:ro
    ports: ["7081:7081"]   # identity admin API (x-api-key), used by seed-identity.sh
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:7080/api/check/readiness"]
      interval: 5s
      retries: 60

  issuerservice:
    image: reed/issuerservice:local
    build:
      context: ../launchers/issuerservice
    container_name: reed-issuerservice
    depends_on:
      init-vault:
        condition: service_completed_successfully
      reed-backend:
        condition: service_healthy
    environment:
      EDC_IH_API_SUPERUSER_KEY: ${IH_SUPERUSER_KEY}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    volumes:
      - ./issuerservice/config.properties:/app/config/config.properties:ro
    ports: ["10013:10013", "10015:10015"]   # issuer admin + identity APIs (x-api-key)

  # Nordvind Energy Systems AS - OEM (Stavanger, NO)
  nordvind:
    image: reed/connector:local
    build:
      context: ../launchers/connector
    container_name: reed-nordvind
    depends_on:
      init-vault:
        condition: service_completed_successfully
      reed-backend:
        condition: service_healthy
      identityhub:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    volumes:
      - ./nordvind/config.properties:/app/config/config.properties:ro
    ports:
      - "19193:19193"   # Management API (key-protected; the dashboard goes through the REED backend)
      - "19291:19291"   # public data plane (EDR pulls)

  # Hanse Marine & Rail GmbH - OEM (Kiel, DE)
  hanse:
    image: reed/connector:local
    build:
      context: ../launchers/connector
    container_name: reed-hanse
    depends_on:
      init-vault:
        condition: service_completed_successfully
      reed-backend:
        condition: service_healthy
      identityhub:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    volumes:
      - ./hanse/config.properties:/app/config/config.properties:ro
    ports:
      - "41193:41193"   # Management API (key-protected; the dashboard goes through the REED backend)
      - "41291:41291"   # public data plane (EDR pulls)

  # Castellum Fundición S.L. - SUPPLIER (Bilbao, ES)
  castellum:
    image: reed/connector:local
    build:
      context: ../launchers/connector
    container_name: reed-castellum
    depends_on:
      init-vault:
        condition: service_completed_successfully
      reed-backend:
        condition: service_healthy
      identityhub:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    volumes:
      - ./castellum/config.properties:/app/config/config.properties:ro
    ports:
      - "29193:29193"   # Management API (key-protected; the dashboard goes through the REED backend)
      - "29291:29291"   # public data plane (EDR pulls)

  # Wisła Precision Machining Sp. z o.o. - SUPPLIER (Gdańsk, PL)
  wisla:
    image: reed/connector:local
    build:
      context: ../launchers/connector
    container_name: reed-wisla
    depends_on:
      init-vault:
        condition: service_completed_successfully
      reed-backend:
        condition: service_healthy
      identityhub:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    volumes:
      - ./wisla/config.properties:/app/config/config.properties:ro
    ports:
      - "42193:42193"   # Management API (key-protected; the dashboard goes through the REED backend)
      - "42291:42291"   # public data plane (EDR pulls)

  # Maasvlakte Heavy Lift B.V. - SERVICE (Rotterdam, NL)
  maasvlakte:
    image: reed/connector:local
    build:
      context: ../launchers/connector
    container_name: reed-maasvlakte
    depends_on:
      init-vault:
        condition: service_completed_successfully
      reed-backend:
        condition: service_healthy
      identityhub:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    volumes:
      - ./maasvlakte/config.properties:/app/config/config.properties:ro
    ports:
      - "43193:43193"   # Management API (key-protected; the dashboard goes through the REED backend)
      - "43291:43291"   # public data plane (EDR pulls)

  # Rhein NDT Prüflabor GmbH - SERVICE (Duisburg, DE)
  rhein-ndt:
    image: reed/connector:local
    build:
      context: ../launchers/connector
    container_name: reed-rhein-ndt
    depends_on:
      init-vault:
        condition: service_completed_successfully
      reed-backend:
        condition: service_healthy
      identityhub:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    volumes:
      - ./rhein-ndt/config.properties:/app/config/config.properties:ro
    ports:
      - "44193:44193"   # Management API (key-protected; the dashboard goes through the REED backend)
      - "44291:44291"   # public data plane (EDR pulls)

  # ---------- Federated Catalog (crawls every connector) ----------
  federated-catalog:
    image: reed/federated-catalog:local
    build:
      context: ../launchers/federated-catalog
    container_name: reed-federated-catalog
    depends_on:
      init-vault:
        condition: service_completed_successfully
      identityhub:
        condition: service_healthy
      nordvind:
        condition: service_started
      hanse:
        condition: service_started
      castellum:
        condition: service_started
      wisla:
        condition: service_started
      maasvlakte:
        condition: service_started
      rhein-ndt:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    volumes:
      - ./federated-catalog/config.properties:/app/config/config.properties:ro
      - ./federated-catalog/participants.json:/app/config/participants.json:ro
    ports: ["39193:39193"]

  # ---------- REED Dashboard (React SPA; login via Keycloak) ----------
  dashboard:
    image: reed/dashboard:local
    build:
      context: ../services/reed-dashboard
    container_name: reed-dashboard
    ports: ["8088:8080"]
    volumes:
      - ./dashboard/config.json:/usr/share/nginx/html/config.json:ro

volumes:
  reed-pgdata:
