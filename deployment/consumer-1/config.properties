# --- consumer-1 connector configuration ---
edc.participant.id=consumer-1
edc.runtime.id=consumer-1

# API endpoints (container-internal ports)
web.http.port=29191
web.http.path=/api
web.http.management.port=29193
web.http.management.path=/management
web.http.control.port=29192
web.http.control.path=/control
web.http.protocol.port=29194
web.http.protocol.path=/protocol
web.http.version.port=29195
web.http.version.path=/version

# DSP protocol URL the consumer advertises back to the provider
edc.dsp.callback.address=http://consumer-1:29194/protocol

# Consumer data-plane public API - where the consumer proxies EDR pulls
edc.dataplane.api.public.baseurl=http://consumer-1:29291/public/
web.http.public.port=29291
web.http.public.path=/public

# Data-plane self-registration
edc.transfer.proxy.token.signer.privatekey.alias=consumer-1-signing-key
edc.transfer.proxy.token.verifier.publickey.alias=consumer-1-verification-key

# HashiCorp Vault
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root
edc.vault.hashicorp.health.check.enabled=false

# CORS – required for the browser-based Data Dashboard
edc.web.rest.cors.enabled=true
edc.web.rest.cors.origins=*
edc.web.rest.cors.headers=origin, content-type, accept, authorization, x-api-key
edc.web.rest.cors.methods=GET, POST, DELETE, PUT, OPTIONS
