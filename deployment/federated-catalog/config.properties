# --- standalone federated catalog configuration ---
edc.participant.id=federated-catalog
edc.runtime.id=federated-catalog

web.http.port=39191
web.http.path=/api

# Management API (hosts the federated catalog query endpoint in v0.17.0)
web.http.management.port=39193
web.http.management.path=/management

# Protocol / control (not strictly used by the FC but avoid port clashes)
web.http.protocol.port=39194
web.http.protocol.path=/protocol
web.http.control.port=39192
web.http.control.path=/control
web.http.version.port=39195
web.http.version.path=/version

# Crawler schedule (for a demo we crawl often)
edc.catalog.cache.execution.delay.seconds=5
edc.catalog.cache.execution.period.seconds=15
edc.catalog.cache.partition.num.crawlers=2

# Static node directory - participants file is bind-mounted at this path
edc.mvd.participants.file=/app/config/participants.json

# HashiCorp Vault
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root
edc.vault.hashicorp.health.check.enabled=false

# CORS – required for the browser-based Data Dashboard
edc.web.rest.cors.enabled=true
edc.web.rest.cors.origins=*
edc.web.rest.cors.headers=origin, content-type, accept, authorization, x-api-key
edc.web.rest.cors.methods=GET, POST, DELETE, PUT, OPTIONS
