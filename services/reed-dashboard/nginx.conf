server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One origin for the browser (http://127.0.0.1:8088): Keycloak, the backend and the connectors' public
    # data planes are proxied below, so a remote host needs only this port forwarded.
    # Docker's DNS, resolved per request so nginx starts even before the upstreams.
    resolver 127.0.0.11 valid=10s;
    proxy_buffer_size 64k;  # Keycloak's login responses carry large cookies/headers
    proxy_buffers 8 64k;

    # Keycloak (its KC_HOSTNAME is this origin, so every URL it emits points back here).
    location ~ ^/(realms|resources|admin|js)/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
    }

    # REED backend API.
    location /reed/ {
        set $backend http://reed-backend:8080;
        proxy_pass $backend;
        proxy_read_timeout 300s;  # LLM-backed assistant calls can be slow
    }

    # Connectors' public data planes (the browser's EDR pulls): /dp/<connector>:<x291 port>/public/...
    location ~ ^/dp/(?<dp_host>[a-z0-9-]+):(?<dp_port>\d+291)/(?<dp_path>public/.*)$ {
        proxy_pass http://$dp_host:$dp_port/$dp_path$is_args$args;
    }

    # config.json is read at runtime by the app; never cache it.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed bundles never change: cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and the SPA fallback) must be revalidated, or browsers keep
    # pointing at the previous release's bundles after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
