server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.json is read at runtime by the app; never cache it.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed bundles never change: cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and the SPA fallback) must be revalidated, or browsers keep
    # pointing at the previous release's bundles after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
