server {
    # TLS: certificate and key are mounted at /tls by docker compose (deployment/tls, from the generator).
    listen 8080 ssl;
    ssl_certificate     /tls/dashboard.crt;
    ssl_certificate_key /tls/dashboard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.json is read at runtime by the app; never cache it.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed bundles never change: cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and the SPA fallback) must be revalidated, or browsers keep
    # pointing at the previous release's bundles after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
