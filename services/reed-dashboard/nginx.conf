server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.json is read at runtime by the app; never cache it.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
